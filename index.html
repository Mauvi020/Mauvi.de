<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mauvi020 | Profile</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #090909;
            --card-bg: rgba(15, 15, 15, 0.96);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --accent-green: #00ff88;
            --laby-btn-bg: rgba(255, 255, 255, 0.05);
            --laby-btn-border: rgba(255, 255, 255, 0.1);
            --laby-btn-hover: rgba(255, 255, 255, 0.12);
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(180deg, rgba(9,9,9,0.5) 0%, var(--bg-dark) 100%), 
                              url('https://laby.net/background/Swamp%20Hut.png');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        .profile-card {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            border-radius: 32px;
            padding: 35px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
            text-align: center;
            margin: 20px;
        }

        .skin-render {
            height: 220px;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.9));
            margin-bottom: 10px;
        }

        .username {
            font-size: 2.8rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -1.5px;
            background: linear-gradient(to bottom, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .uuid {
            font-family: 'monospace';
            font-size: 0.7rem;
            color: var(--text-dim);
            background: rgba(255,255,255,0.05);
            padding: 5px 12px;
            border-radius: 8px;
            display: inline-block;
            margin: 8px 0 20px 0;
        }

        .social-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .social-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .badge-btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 5px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            color: #efefef;
            background: var(--laby-btn-bg);
            border: 1px solid var(--laby-btn-border);
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .badge-btn:hover {
            background: var(--laby-btn-hover);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
            color: #fff;
        }

        .divider { height: 1px; background: rgba(255,255,255,0.1); margin: 25px 0; }

        .spotify-live-container {
            background: rgba(29, 185, 84, 0.05);
            border: 1px solid rgba(29, 185, 84, 0.15);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            text-decoration: none;
            display: block;
            transition: 0.3s;
        }
        .spotify-live-container:hover { background: rgba(29, 185, 84, 0.12); }

        .now-playing-img { 
            width: 100%; 
            max-width: 260px;
            height: auto; 
            border-radius: 12px;
            margin-top: 10px;
        }

        .label { font-size: 0.7rem; color: #1DB954; font-weight: 800; text-transform: uppercase; display: block; letter-spacing: 1px; }

        .artist-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .artist-grid { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        
        .artist-item { 
            text-align: center; 
            text-decoration: none; 
            transition: 0.2s;
        }

        .artist-item:hover { transform: scale(1.1); }

        .artist-img { 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .artist-item:hover .artist-img { border-color: #1DB954; }

        .artist-name { 
            font-size: 0.65rem; 
            color: var(--text-dim); 
            margin-top: 6px; 
            display: block; 
            font-weight: 600; 
        }

        .server-widget {
            background: var(--laby-btn-bg);
            padding: 15px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: white;
            border: 1px solid var(--laby-btn-border);
            transition: 0.3s;
        }

        .status-dot {
            height: 8px; width: 8px; background: var(--accent-green);
            border-radius: 50%; display: inline-block;
            box-shadow: 0 0 10px var(--accent-green); margin-left: 8px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <img src="https://skin.laby.net/api/render/user/febc1134-94fe-4417-a381-37f55efddb34.png?shadow=true&width=350" class="skin-render">

        <h1 class="username">Mauvi020</h1>
        <div class="uuid">febc1134-94fe-4417-a381-37f55efddb34</div>

                <a href="https://www.xbox.com/play/user/Mauvi020" target="_blank" class="badge-btn"><i class="fab fa-xbox" style="color:#107c10"></i> Xbox</a>
                <a href="https://open.spotify.com/user/31ppagytimzlrleudi3qm2db7y4u" target="_blank" class="badge-btn"><i class="fab fa-spotify" style="color:#1db954"></i> Spotify</a>
            </div>
            <div class="social-row" style="width: 85%; margin: 0 auto;">
                <a href="https://youtube.com/channel/UC9M2Et3igjAWlEczG97EmRg" target="_blank" class="badge-btn"><i class="fab fa-youtube" style="color:#ff0000"></i> YouTube</a>
                <a href="https://discord.com/users/1152903963914551296" target="_blank" class="badge-btn"><i class="fab fa-discord" style="color:#5865f2"></i> Discord</a>
                <a href="https://www.twitch.tv/mauvi020" target="_blank" class="badge-btn"><i class="fab fa-twitch" style="color:#9146ff"></i> Twitch</a>
            </div>
        </div>

        <div class="divider"></div>

        <a href="https://open.spotify.com/user/31ppagytimzlrleudi3qm2db7y4u" target="_blank" class="spotify-live-container">
            <span class="label"><i class="fab fa-spotify"></i> Live auf Spotify</span>
            <img id="spotify-live" src="https://now-play.vercel.app/api/generate?uid=d8e7820b-dd53-49fd-9736-3b57b40516d4&theme=dark" class="now-playing-img" alt="Spotify Live">

        <div class="artist-box">

            <div class="artist-grid">
                <a href="https://open.spotify.com/intl-de/artist/6mx3Y8XNLPaS2pjJbQFq3W" target="_blank" class="artist-item">
                    <img src="https://i.scdn.co/image/ab6761610000e5eb875788a1da4dbe430683f0b1" class="artist-img">
                    <span class="artist-name">bunii</span>
                </a>
                <a href="https://open.spotify.com/intl-de/artist/3tQzzidoPfVifoURnDfgmD" target="_blank" class="artist-item">
                    <img src="https://i.scdn.co/image/ab6761610000e5ebd4a3afb6b198c6c6bc200d8e" class="artist-img">
                    <span class="artist-name">t-low</span>
                </a>
                <a href="https://open.spotify.com/intl-de/artist/34LetYSjEuG2fBb4Z8PwPg" target="_blank" class="artist-item">
                    <img src="https://i.scdn.co/image/ab6761610000e5ebbe86fcdf9a5f55d9d7c5dd31" class="artist-img">
                    <span class="artist-name">Pashanim</span>
                </a>
            </div>
        </div>

        <a href="https://laby.net/server/mauvi.de" class="server-widget" target="_blank">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="https://api.mcsrvstat.us/icon/mauvi.de" width="30" style="border-radius: 6px;">
                <div style="text-align: left;">
                    <div style="font-weight: 800; font-size: 0.85rem;">Mauvi.de</div>
                    <div style="font-size: 0.6rem; color: var(--text-dim);">Minecraft Server</div>
                </div>
            </div>
            <div>
                <span id="player-count" style="font-weight: 800; color: var(--accent-green); font-size: 0.75rem;">Online</span>
                <div class="status-dot"></div>

    </div>

    <script>
        function refreshSpotify() {
            const img = document.getElementById('spotify-live');
            const url = "https://now-play.vercel.app/api/generate?uid=d8e7820b-dd53-49fd-9736-3b57b40516d4&theme=dark";
            img.src = url + "&v=" + new Date().getTime();
        }
        setInterval(refreshSpotify, 15000);

        async function fetchServer() {
            try {
                const res = await fetch('https://api.mcsrvstat.us/2/mauvi.de');
                const data = await res.json();
                if(data.online) document.getElementById('player-count').innerText = data.players.online + " Spieler";
            } catch(e) {}
        }
        fetchServer();
    </script>
</body>
</html>
